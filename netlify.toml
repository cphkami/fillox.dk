[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 needs Node >= 20.9 (package.json → engines); 22 is the current LTS line.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers on the files Netlify's CDN serves on its own: public/ (/images/*, /brand/*),
# /_next/static/* and /_next/image (Image CDN). These rules do NOT reach the responses of the
# Next.js server handler (pages, robots.txt, sitemap.xml, 404s): next.config.ts → headers() sends
# the same set there. The 308s of next.config.ts → redirects() carry neither (Next.js drops its
# headers on them; Netlify adds HSTS + nosniff); see config/securityHeaders.ts.
# The values and the reasons for each one live in config/securityHeaders.ts. This block is a copy
# (TOML cannot import it): change both, keep one line per header, double-quoted values only.
# `npm run check:market` (also before every build) fails when a name or value here differs.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://filloxdanmark.app4.geckobooking.dk https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com https://*.g.doubleclick.net https://*.google.com https://*.google.dk https://ad.doubleclick.net https://www.googleadservices.com https://www.facebook.com; font-src 'self'; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.g.doubleclick.net https://*.google.com https://*.google.dk https://ad.doubleclick.net https://www.googleadservices.com https://pagead2.googlesyndication.com https://connect.facebook.net https://www.facebook.com; frame-src https://*.geckobooking.dk https://checkout.dibspayment.eu https://onpay.io https://*.onpay.io https://www.googletagmanager.com; form-action 'self' https://www.facebook.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
