<!DOCTYPE html>
<!-- Netlify Forms detection file. Never linked; see lib/forms.ts.
     Keep field names in sync with the forms that submit to it. -->
<html>
  <body>
    <form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="kontakt" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="clinic" />
      <textarea name="message"></textarea>
      <input name="consent" />
    </form>
    <form name="osterbro-besked" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="osterbro-besked" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
    </form>
    <form name="nyhedsbrev" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="nyhedsbrev" />
      <input name="bot-field" />
      <input name="email" />
    </form>
  </body>
</html>
