<!DOCTYPE html>
<!-- No-JavaScript target of the "kontakt" form (content/pages/contact.ts → form.noJsAction).
     Never linked. Netlify Forms stores the POST and serves this static file, which forwards
     to the thank-you page (app/kontakt/tak). With JavaScript the form posts via lib/forms.ts. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/kontakt/tak" />
    <link rel="canonical" href="/kontakt/tak" />
  </head>
  <body>
    <a href="/kontakt/tak">/kontakt/tak</a>
  </body>
</html>
